<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maple — Administración</title>
<style>
:root{--vino:#7d1818;--cream:#fffaf2;--cafe:#513c26;--line:#e8ded1}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--cafe);font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 18px 70px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 10px 35px rgba(81,60,38,.06)}
h1{color:var(--vino);margin:0 0 6px;font-size:30px}h2{font-size:18px;margin:0 0 16px;color:var(--vino)}
p{line-height:1.5}.muted{font-size:13px;opacity:.7}label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}
input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:700}
.primary{background:var(--vino);color:#fff}.secondary{background:#f5eee6;color:var(--vino)}.danger{background:#fff0f0;color:#a31313}
.hidden{display:none!important}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.switchrow{display:flex;justify-content:space-between;gap:15px;align-items:center}.switchrow input{width:22px;height:22px}
.status{padding:10px 12px;border-radius:12px;background:#f5eee6;font-size:13px;margin-top:10px}.ok{background:#edf8ef}.err{background:#fff0f0}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maple · Administración</h1>
  <p class="muted">Cierra fechas, bloquea horarios saturados o pausa todos los pedidos.</p>

  <div class="card" id="login-card">
    <h2>Entrar</h2>
    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="btn primary" id="login" style="margin-top:14px">Entrar</button>
    <div id="login-status"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>Pausa general</h2>
      <div class="switchrow">
        <div><strong>Cerrar pedidos temporalmente</strong><div class="muted">La tienda seguirá visible, pero no permitirá pagar ni enviar pedidos.</div></div>
        <input type="checkbox" id="ordersPaused">
      </div>
      <label>Mensaje que verá el cliente</label>
      <textarea id="pauseMessage" rows="2">Pedidos temporalmente cerrados. Gracias por tu comprensión.</textarea>
      <button class="btn primary" id="save-pause" style="margin-top:14px">Guardar</button>
    </div>

    <div class="card">
      <h2>Cerrar un día completo</h2>
      <label>Fecha</label>
      <input id="closed-date" type="date">
      <button class="btn primary" id="add-date" style="margin-top:14px">Cerrar este día</button>
      <div id="closed-list"></div>
    </div>

    <div class="card">
      <h2>Bloquear horario por saturación</h2>
      <label>Fecha</label>
      <input id="range-date" type="date">
      <div class="row">
        <div><label>Desde</label><input id="range-start" type="time" min="10:00" max="17:00" step="900" value="14:00"></div>
        <div><label>Hasta</label><input id="range-end" type="time" min="10:00" max="17:00" step="900" value="15:00"></div>
      </div>
      <button class="btn primary" id="add-range" style="margin-top:14px">Bloquear horario</button>
      <div id="ranges-list"></div>
    </div>

    <div id="status"></div>
    <button class="btn secondary" id="logout">Cerrar sesión</button>
  </div>
</div>
<script>
let password = sessionStorage.getItem("maple_admin_password") || "";
let config = { ordersPaused:false, pauseMessage:"Pedidos temporalmente cerrados. Gracias por tu comprensión.", closedDates:[], blockedRanges:{} };

const $ = id => document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function prettyDate(s){ return new Date(s+"T00:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }

async function api(method="GET"){
  const opts={method,headers:{"x-admin-password":password}};
  if(method==="POST"){
    opts.headers["Content-Type"]="application/json";
    opts.body=JSON.stringify(config);
  }
  const r=await fetch("/api/admin-availability",opts);
  const data=await r.json();
  if(!r.ok) throw new Error(data.error || "Error");
  return data;
}

function showStatus(msg, ok=true){
  $("status").innerHTML=`<div class="status ${ok?"ok":"err"}">${esc(msg)}</div>`;
  setTimeout(()=>{ $("status").innerHTML=""; },3500);
}

function render(){
  $("ordersPaused").checked=!!config.ordersPaused;
  $("pauseMessage").value=config.pauseMessage || "";
  $("closed-list").innerHTML=config.closedDates.length
    ? config.closedDates.map(d=>`<div class="item"><span>${esc(prettyDate(d))}</span><button class="btn danger" data-remove-date="${esc(d)}">Reabrir</button></div>`).join("")
    : `<p class="muted">No hay días cerrados.</p>`;

  const rows=[];
  Object.keys(config.blockedRanges).sort().forEach(date=>{
    (config.blockedRanges[date]||[]).forEach((r,i)=>{
      rows.push(`<div class="item"><span><strong>${esc(prettyDate(date))}</strong><br>${esc(r.start)} – ${esc(r.end)}</span><button class="btn danger" data-remove-range="${esc(date)}" data-index="${i}">Quitar</button></div>`);
    });
  });
  $("ranges-list").innerHTML=rows.length?rows.join(""):`<p class="muted">No hay horarios bloqueados.</p>`;

  document.querySelectorAll("[data-remove-date]").forEach(b=>b.onclick=async()=>{
    config.closedDates=config.closedDates.filter(d=>d!==b.dataset.removeDate);
    await save("Día reabierto.");
  });
  document.querySelectorAll("[data-remove-range]").forEach(b=>b.onclick=async()=>{
    const d=b.dataset.removeRange, i=Number(b.dataset.index);
    config.blockedRanges[d].splice(i,1);
    if(!config.blockedRanges[d].length) delete config.blockedRanges[d];
    await save("Horario liberado.");
  });
}

async function save(msg){
  try{ config=await api("POST"); render(); showStatus(msg); }
  catch(e){ showStatus(e.message,false); }
}

async function login(){
  password=$("password").value;
  try{
    config=await api("GET");
    sessionStorage.setItem("maple_admin_password",password);
    $("login-card").classList.add("hidden");
    $("panel").classList.remove("hidden");
    render();
  }catch(e){
    $("login-status").innerHTML=`<div class="status err">${esc(e.message)}</div>`;
  }
}

$("login").onclick=login;
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

$("save-pause").onclick=async()=>{
  config.ordersPaused=$("ordersPaused").checked;
  config.pauseMessage=$("pauseMessage").value.trim() || "Pedidos temporalmente cerrados. Gracias por tu comprensión.";
  await save("Pausa general actualizada.");
};

$("add-date").onclick=async()=>{
  const d=$("closed-date").value;
  if(!d) return showStatus("Selecciona una fecha.",false);
  if(!config.closedDates.includes(d)) config.closedDates.push(d);
  config.closedDates.sort();
  await save("Día cerrado.");
  $("closed-date").value="";
};

$("add-range").onclick=async()=>{
  const d=$("range-date").value, start=$("range-start").value, end=$("range-end").value;
  if(!d || !start || !end) return showStatus("Completa fecha y horario.",false);
  if(start>=end) return showStatus("La hora final debe ser posterior a la inicial.",false);
  if(start<"10:00" || end>"17:00") return showStatus("El horario debe quedar entre 10:00 y 17:00.",false);
  if(!config.blockedRanges[d]) config.blockedRanges[d]=[];
  config.blockedRanges[d].push({start,end});
  config.blockedRanges[d].sort((a,b)=>a.start.localeCompare(b.start));
  await save("Horario bloqueado.");
  $("range-date").value="";
};

$("logout").onclick=()=>{
  sessionStorage.removeItem("maple_admin_password");
  location.reload();
};

if(password){
  api("GET").then(data=>{
    config=data;
    $("login-card").classList.add("hidden");
    $("panel").classList.remove("hidden");
    render();
  }).catch(()=>sessionStorage.removeItem("maple_admin_password"));
}
</script>
</body>
</html>
